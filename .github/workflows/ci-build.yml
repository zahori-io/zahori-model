name: CI Build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE*', '.gitignore', 'renovate.json']
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build
        run: mvn -B clean compile

      - name: Test
        run: mvn -B test

      - name: Verify (package + checks)
        run: mvn -B verify -DskipTests
